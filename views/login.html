<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HudumaDesk</title>
  <meta name="description" content="Sign in to your HudumaDesk citizen account to manage your service requests.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="auth-logo">
      <div class="logo-icon">🏛️</div>
      <span>HudumaDesk</span>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your citizen account to manage your requests</p>

    <!-- Demo credentials hint -->
    <div style="background:rgba(15,118,110,0.1);border:1px solid rgba(15,118,110,0.3);border-radius:var(--radius);padding:0.9rem 1rem;margin-bottom:1.5rem;font-size:0.82rem">
      <div style="font-weight:700;color:var(--primary-light);margin-bottom:0.3rem">🔑 Demo Accounts</div>
      <div style="color:var(--text-muted)">Citizen: <strong>john@example.com</strong> / <strong>citizen123</strong></div>
      <div style="color:var(--text-muted)">Admin: <strong>admin@muranga.go.ke</strong> / <strong>admin123</strong></div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="input-group-btn" id="togglePassword" title="Show/hide password">👁️</button>
        </div>
      </div>

      <div id="errorMsg" class="form-error hidden" style="padding:0.75rem;background:rgba(239,68,68,0.1);border-radius:var(--radius);margin-bottom:1rem;font-size:0.88rem"></div>

      <button type="submit" class="btn btn-primary w-full" id="submitBtn">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="hidden">⏳</span>
      </button>
    </form>

    <div class="auth-divider">or</div>

    <a href="/track" class="btn btn-outline w-full" style="justify-content:center">
      🔍 Track a request without logging in
    </a>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one free</a>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  // Redirect if already logged in
  (async () => {
    try {
      const data = await api.get('/api/auth/me');
      if (data.authenticated) {
        window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
      }
    } catch {}
  })();

  document.getElementById('togglePassword').addEventListener('click', () => {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    document.getElementById('togglePassword').textContent = pw.type === 'password' ? '👁️' : '🙈';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.classList.add('hidden');
    submitBtn.disabled = true;
    document.getElementById('btnText').textContent = 'Signing in…';
    document.getElementById('btnSpinner').classList.remove('hidden');

    try {
      const data = await api.post('/api/auth/login', { email, password });
      toast.show(`Welcome back, ${data.name}! 👋`, 'success');
      setTimeout(() => {
        window.location.href = data.role === 'admin' ? '/admin' : '/dashboard';
      }, 800);
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.remove('hidden');
      submitBtn.disabled = false;
      document.getElementById('btnText').textContent = 'Sign In';
      document.getElementById('btnSpinner').classList.add('hidden');
    }
  });
</script>
</body>
</html>
